<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Örökbefogadások kezelése - Boldog Mancs Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="adoptions.css"> 
</head>
<body>
    <header class="admin-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-paw"></i>
                    </div>
                    <h1>Örökbefogadások kezelése</h1>
                </div>
                <div>
                    <a href="admin.html" class="btn btn-primary">
                        <i class="fas fa-arrow-left"></i> Vissza
                    </a>
                </div>
            </div>
        </div>
    </header>
    
    <main class="admin-main">
        <div class="container">
            <div class="page-title">
                <h2>Örökbefogadási kérelmek</h2>
                <button class="btn btn-primary" onclick="loadAdoptions()">
                    <i class="fas fa-sync-alt"></i> Frissítés
                </button>
            </div>
            
            <div class="stats-bar" id="statsBar">
                <div class="stat-item">
                    <span class="stat-number" id="totalCount">0</span>
                    <span class="stat-label">Összes kérelem</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="pendingCount">0</span>
                    <span class="stat-label">Függőben</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="approvedCount">0</span>
                    <span class="stat-label">Elfogadva</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="rejectedCount">0</span>
                    <span class="stat-label">Elutasítva</span>
                </div>
            </div>
            
            <div class="filter-tabs">
                <button class="filter-tab active" data-status="all">Összes</button>
                <button class="filter-tab" data-status="pending">Függőben</button>
                <button class="filter-tab" data-status="approved">Elfogadva</button>
                <button class="filter-tab" data-status="rejected">Elutasítva</button>
            </div>
            
            <div id="adoptionsGrid" class="adoptions-grid">
                <!-- Ide jönnek az örökbefogadások -->
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <h3>Betöltés...</h3>
                </div>
            </div>
        </div>
    </main>
    
    <script src="adoptions.js">
    </script>
</body>
</html>
